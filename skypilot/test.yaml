name: livekit-wakeword-test

resources:
  cloud: nebius
  accelerators: L40S:1
  cpus: 8+
  memory: 32+
  disk_size: 500
  autostop:
    idle_minutes: 10
    down: false

workdir: .

file_mounts:
  /outputs:
    source: nebius://wakeword-model-bucket
    mode: MOUNT

setup: |
  set -e
  sudo apt-get update && sudo apt-get install -y espeak-ng libsndfile1 ffmpeg sox portaudio19-dev
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.cargo/bin:$PATH"
  DATA_DIR="${HOME_DIR}/${DATA_DIR}"
  OUTPUT_DIR="${HOME_DIR}/${OUTPUT_DIR}"
  mkdir -p "$DATA_DIR" "$OUTPUT_DIR"
  ln -sfn "$DATA_DIR" data
  ln -sfn "$OUTPUT_DIR" output
  uv sync --extra train --extra datagen --extra eval
  uv run livekit-wakeword setup --data-dir "$DATA_DIR"

run: |
  set -e
  export PATH="$HOME/.cargo/bin:$PATH"
  DATA_DIR="${HOME_DIR}/${DATA_DIR}"
  OUTPUT_DIR="${HOME_DIR}/${OUTPUT_DIR}"
  MODEL_DIR="$OUTPUT_DIR/${MODEL_NAME}"
  ARTIFACT_DIR="/outputs/${WORKSPACE}/${MODEL_NAME}"
  ln -sfn "$DATA_DIR" data
  ln -sfn "$OUTPUT_DIR" output
  uv run livekit-wakeword run configs/${CONFIG_FILE}
  mkdir -p "$ARTIFACT_DIR"
  cp "$MODEL_DIR/${MODEL_NAME}.weights.h5" "$ARTIFACT_DIR/"
  cp "$MODEL_DIR/${MODEL_NAME}.tflite" "$ARTIFACT_DIR/"
  cp "$MODEL_DIR/${MODEL_NAME}_int8.tflite" "$ARTIFACT_DIR/"
  cp "$MODEL_DIR/${MODEL_NAME}_metrics.json" "$ARTIFACT_DIR/"
  cp "$MODEL_DIR/${MODEL_NAME}_det.png" "$ARTIFACT_DIR/"
  cp "$MODEL_DIR/${MODEL_NAME}_eval.json" "$ARTIFACT_DIR/"
  cp "configs/${CONFIG_FILE}" "$ARTIFACT_DIR/config.yaml"

envs:
  HOME_DIR: /home/ubuntu
  DATA_DIR: persistent/data
  OUTPUT_DIR: persistent/output
  WORKSPACE: livekit-embedded-wakeword
  MODEL_NAME: test_repcnn
  CONFIG_FILE: test_rep.yaml
