# Test config for RepCNN (dilated DS-conv) architecture
# Uses the same minimal setup as test.yaml but with repcnn model type
model_name: test_repcnn

target_phrases: ["hey livekit"]

# ============================================================================
# Data Generation
# ============================================================================

n_samples: 100
n_samples_val: 20
tts_batch_size: 10

custom_negative_phrases:
  - "livekit"
  - "hey libby"
  - "hey liquid"

# ============================================================================
# Paths
# ============================================================================

data_dir: ./data
output_dir: ./output

# ============================================================================
# Augmentation
# ============================================================================

augmentation:
  clip_duration: 2.0
  batch_size: 8
  rounds: 1
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]
  window_size_ms: 30
  window_step_ms: 20
  num_channels: 40

# ============================================================================
# Model Architecture
# ============================================================================

model:
  model_type: repcnn
  model_size: small

# ============================================================================
# Training
# ============================================================================

steps: 500
learning_rate: 0.001
max_negative_weight: 1000
target_fp_per_hour: 1.0

batch_n_per_class:
  positive: 10
  adversarial_negative: 10
  negative_speech: 64
